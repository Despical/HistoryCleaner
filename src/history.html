<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History</title>
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="history.css">
</head>
<body>
<header id="top">
  <div id="searchMode" class="bar">
    <h1 data-i18n="title">History</h1>
    <div class="search">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" type="search" data-i18n-attr="placeholder:search" autofocus>
    </div>
    <select id="lang" class="lang" data-i18n-attr="title:language" aria-label="Language"></select>
  </div>
  <div id="selMode" class="bar" hidden>
    <button id="selClose" class="icon" data-i18n-attr="title:clearSel" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <span id="selCount"></span>
    <span class="grow"></span>
    <button id="selAll" class="text" type="button"></button>
    <button id="selDel" class="text strong" type="button" data-i18n="del">Delete</button>
  </div>
</header>

<div id="layout">
  <nav>
    <a class="navitem active"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8z"/></svg><span data-i18n="navHistory">History</span></a>
    <a id="clearData" class="navitem" href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg><span data-i18n="navClear">Clear browsing data</span></a>
    <a id="wipeAll" class="navitem" href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zm2.46-7.12 1.41-1.41L12 12.59l2.12-2.12 1.41 1.41L13.41 14l2.12 2.12-1.41 1.41L12 15.41l-2.12 2.12-1.41-1.41L10.59 14l-2.13-2.12zM15.5 4l-1-1h-5l-1 1H5v2h14V4z"/></svg><span data-i18n="navWipe">Delete all history</span></a>
  </nav>
  <main>
    <div id="list"></div>
    <p id="empty" data-i18n="empty" hidden>No entries found.</p>
  </main>
</div>

<div id="menu" hidden><button type="button" id="menuDel" data-i18n="remove">Remove from history</button></div>

<dialog id="confirmDlg">
  <h2 data-i18n="confirmTitle">Remove from history?</h2>
  <p id="confirmText"></p>
  <div class="actions">
    <button id="confirmNo" class="text" type="button" data-i18n="cancel">Cancel</button>
    <button id="confirmYes" class="text strong" type="button" data-i18n="del">Delete</button>
  </div>
</dialog>

<dialog id="progDlg">
  <h2 data-i18n="deleting">Deleting…</h2>
  <div class="track"><div id="fill"></div></div>
  <p id="ptext"></p>
  <div class="actions"><button id="cancel" class="text" type="button" data-i18n="stop">Stop</button></div>
</dialog>

<script src="i18n.js"></script>
<script src="history.js"></script>
</body>
</html>
